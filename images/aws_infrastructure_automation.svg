<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="awsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7300;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffffff">
    AWS Infrastructure Automation
  </text>
  <text x="400" y="90" font-size="16" text-anchor="middle" fill="#94a3b8">
    Terraform • EKS • VPC • Kubernetes
  </text>
  
  <!-- Layer 1: VPC Network -->
  <g id="vpc-layer">
    <rect x="50" y="130" width="700" height="80" rx="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="170" r="20" fill="#00d4ff" opacity="0.8"/>
    <text x="130" y="175" font-size="14" fill="#00d4ff" font-weight="600">VPC</text>
    <circle cx="250" cy="170" r="20" fill="#00d4ff" opacity="0.6"/>
    <text x="280" y="175" font-size="14" fill="#00d4ff">Subnets</text>
    <circle cx="400" cy="170" r="20" fill="#00d4ff" opacity="0.6"/>
    <text x="430" y="175" font-size="14" fill="#00d4ff">Security Groups</text>
    <circle cx="550" cy="170" r="20" fill="#00d4ff" opacity="0.6"/>
    <text x="580" y="175" font-size="14" fill="#00d4ff">Routing</text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 400 220 L 400 240" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 2: EKS Cluster -->
  <g id="eks-layer">
    <rect x="50" y="250" width="700" height="100" rx="8" fill="none" stroke="#326CE5" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="280" r="25" fill="#326CE5" opacity="0.9"/>
    <text x="120" y="285" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">EKS</text>
    
    <!-- Control Plane -->
    <rect x="200" y="265" width="140" height="50" rx="4" fill="#326CE5" opacity="0.7" stroke="#ffffff" stroke-width="1"/>
    <text x="270" y="282" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">Control Plane</text>
    <text x="270" y="305" font-size="11" text-anchor="middle" fill="#cbd5e1">Managed API</text>
    
    <!-- Worker Nodes -->
    <rect x="400" y="265" width="65" height="50" rx="4" fill="#326CE5" opacity="0.5" stroke="#326CE5" stroke-width="1"/>
    <text x="432" y="298" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">Node 1</text>
    
    <rect x="500" y="265" width="65" height="50" rx="4" fill="#326CE5" opacity="0.5" stroke="#326CE5" stroke-width="1"/>
    <text x="532" y="298" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">Node 2</text>
    
    <rect x="600" y="265" width="65" height="50" rx="4" fill="#326CE5" opacity="0.5" stroke="#326CE5" stroke-width="1"/>
    <text x="632" y="298" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">Node 3</text>
    
    <!-- S3 & DynamoDB -->
    <circle cx="100" cy="340" r="18" fill="url(#awsGradient)" opacity="0.8"/>
    <text x="100" y="345" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">S3</text>
    <text x="100" y="370" font-size="12" text-anchor="middle" fill="#FF9900" font-weight="600">State</text>
    
    <circle cx="250" cy="340" r="18" fill="url(#awsGradient)" opacity="0.8"/>
    <text x="250" y="347" font-size="10" text-anchor="middle" fill="#ffffff" font-weight="600">DDB</text>
    <text x="250" y="370" font-size="12" text-anchor="middle" fill="#FF9900" font-weight="600">Locking</text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 400 360 L 400 380" stroke="#667eea" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 3: Terraform Management -->
  <g id="terraform-layer">
    <rect x="50" y="400" width="700" height="120" rx="8" fill="none" stroke="#764ba2" stroke-width="2" opacity="0.6"/>
    <circle cx="120" cy="450" r="25" fill="#764ba2" opacity="0.9"/>
    <text x="120" y="455" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="600">TF</text>
    
    <!-- Modules -->
    <rect x="200" y="430" width="110" height="40" rx="4" fill="#764ba2" opacity="0.7" stroke="#ffffff" stroke-width="1"/>
    <text x="255" y="458" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">Modules</text>
    
    <!-- Workspaces -->
    <rect x="350" y="430" width="110" height="40" rx="4" fill="#764ba2" opacity="0.5" stroke="#764ba2" stroke-width="1"/>
    <text x="405" y="458" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">Workspaces</text>
    
    <!-- Variables -->
    <rect x="500" y="430" width="110" height="40" rx="4" fill="#764ba2" opacity="0.5" stroke="#764ba2" stroke-width="1"/>
    <text x="555" y="458" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="600">Variables</text>
    
    <!-- Features -->
    <text x="120" y="495" font-size="11" fill="#cbd5e1">• Reusable</text>
    <text x="120" y="515" font-size="11" fill="#cbd5e1">• Modular</text>
    
    <text x="300" y="495" font-size="11" fill="#cbd5e1">• Multi-Env</text>
    <text x="300" y="515" font-size="11" fill="#cbd5e1">• Scalable</text>
    
    <text x="500" y="495" font-size="11" fill="#cbd5e1">• Dev, QA, Prod</text>
    <text x="500" y="515" font-size="11" fill="#cbd5e1">• Automated</text>
  </g>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#667eea" />
    </marker>
  </defs>
</svg>