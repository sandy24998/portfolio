<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jenkinsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#088395;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#066369;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dockerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2496ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a70c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGradient2)"/>
  
  <!-- Title -->
  <text x="400" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Multi-Environment CI/CD Pipeline
  </text>
  <text x="400" y="90" font-size="16" text-anchor="middle" fill="#94a3b8">
    Jenkins • Docker • Kubernetes • GitHub
  </text>
  
  <!-- Pipeline Stage 1: Code -->
  <g id="stage-code">
    <circle cx="80" cy="200" r="35" fill="#00ff88" opacity="0.9"/>
    <text x="80" y="205" font-size="20" text-anchor="middle" fill="#000000" font-weight="bold">⚙</text>
    <text x="80" y="265" font-size="13" text-anchor="middle" fill="#00ff88" font-weight="600">Code</text>
    <text x="80" y="283" font-size="11" text-anchor="middle" fill="#cbd5e1">GitHub</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 120 200 L 160 200" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Pipeline Stage 2: Build -->
  <g id="stage-build">
    <circle cx="220" cy="200" r="35" fill="url(#jenkinsGradient)" opacity="0.9"/>
    <text x="220" y="213" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">🔨</text>
    <text x="220" y="265" font-size="13" text-anchor="middle" fill="#088395" font-weight="600">Build</text>
    <text x="220" y="283" font-size="11" text-anchor="middle" fill="#cbd5e1">Jenkins Job</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 260 200 L 300 200" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Pipeline Stage 3: Test & Scan -->
  <g id="stage-test">
    <circle cx="360" cy="200" r="35" fill="#f97316" opacity="0.9"/>
    <text x="360" y="213" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">✓</text>
    <text x="360" y="265" font-size="13" text-anchor="middle" fill="#f97316" font-weight="600">Test & Scan</text>
    <text x="360" y="283" font-size="11" text-anchor="middle" fill="#cbd5e1">SonarQube, Trivy</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 200 L 440 200" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Pipeline Stage 4: Build Image -->
  <g id="stage-image">
    <circle cx="500" cy="200" r="35" fill="url(#dockerGradient)" opacity="0.9"/>
    <text x="500" y="213" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">🐳</text>
    <text x="500" y="265" font-size="13" text-anchor="middle" fill="#2496ED" font-weight="600">Build Image</text>
    <text x="500" y="283" font-size="11" text-anchor="middle" fill="#cbd5e1">Docker Registry</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 540 200 L 580 200" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Pipeline Stage 5: Deploy -->
  <g id="stage-deploy">
    <circle cx="640" cy="200" r="35" fill="#326CE5" opacity="0.9"/>
    <text x="640" y="213" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold">🚀</text>
    <text x="640" y="265" font-size="13" text-anchor="middle" fill="#326CE5" font-weight="600">Deploy</text>
    <text x="640" y="283" font-size="11" text-anchor="middle" fill="#cbd5e1">Kubernetes</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 680 200 L 720 200" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Approval Gates -->
  <g id="approval-gates">
    <rect x="50" y="360" width="700" height="100" rx="8" fill="none" stroke="#e91e63" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
    <text x="400" y="385" font-size="14" text-anchor="middle" fill="#e91e63" font-weight="600">🔐 Approval Gates</text>
    
    <rect x="80" y="400" width="150" height="40" rx="4" fill="#e91e63" opacity="0.2" stroke="#e91e63" stroke-width="1"/>
    <text x="155" y="425" font-size="12" text-anchor="middle" fill="#e91e63" font-weight="600">QA Approval</text>
    
    <rect x="290" y="400" width="150" height="40" rx="4" fill="#e91e63" opacity="0.2" stroke="#e91e63" stroke-width="1"/>
    <text x="365" y="425" font-size="12" text-anchor="middle" fill="#e91e63" font-weight="600">UAT Approval</text>
    
    <rect x="500" y="400" width="150" height="40" rx="4" fill="#e91e63" opacity="0.2" stroke="#e91e63" stroke-width="1"/>
    <text x="575" y="425" font-size="12" text-anchor="middle" fill="#e91e63" font-weight="600">Prod Approval</text>
  </g>
  
  <!-- Deployment Environments -->
  <g id="environments">
    <text x="400" y="530" font-size="14" text-anchor="middle" fill="#94a3b8" font-weight="600">Deployment Environments</text>
    
    <rect x="80" y="550" width="140" height="40" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
    <text x="150" y="575" font-size="12" text-anchor="middle" fill="#00d4ff" font-weight="600">DEV</text>
    
    <rect x="260" y="550" width="140" height="40" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
    <text x="330" y="575" font-size="12" text-anchor="middle" fill="#00d4ff" font-weight="600">QA</text>
    
    <rect x="440" y="550" width="140" height="40" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
    <text x="510" y="575" font-size="12" text-anchor="middle" fill="#00d4ff" font-weight="600">UAT</text>
    
    <rect x="620" y="550" width="140" height="40" rx="4" fill="#f97316" opacity="0.2" stroke="#f97316" stroke-width="1"/>
    <text x="690" y="575" font-size="12" text-anchor="middle" fill="#f97316" font-weight="600">Production</text>
  </g>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#667eea" />
    </marker>
  </defs>
</svg>